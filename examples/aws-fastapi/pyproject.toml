[project]
name = "aws-fastapi"
version = "0.1.0"
description = "A NEO app"
authors = [{ name = "Nick Wall", email = "mail@walln.dev" }]
dependencies = []

# It is recommended to specify your python version to match your Lambda runtime otherwise you may
# encounter issues with dependencies.
requires-python = "==3.11.*"

[tool.uv.workspace]
members = ["functions", "core"]

[tool.uv.sources]
neo = { git = "https://github.com/neopilot-ai/neo.git", subdirectory = "sdk/python", branch = "dev" }
