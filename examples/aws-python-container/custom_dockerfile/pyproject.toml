[project]
name = "custom_dockerfile"
version = "0.1.0"
description = "Custom Dockerfile"
dependencies = ["core", "neo"]
requires-python = "==3.11.*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
core = { workspace = true }
neo = { git = "https://github.com/neopilot-ai/neo.git", branch = "dev", subdirectory = "sdk/python" }
